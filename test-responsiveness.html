<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsiveness Test - VISHNU PARADISE ROOMS</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .test-panel {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            z-index: 10000;
            max-width: 200px;
        }
        .test-panel div {
            margin: 5px 0;
        }
        .test-panel .size-indicator {
            background: #D4AF37;
            color: #000;
            padding: 5px;
            border-radius: 4px;
            font-weight: bold;
            text-align: center;
        }
        .test-panel .breakpoint {
            color: #4CAF50;
        }
        .device-frame {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 3px solid #D4AF37;
            background: rgba(212, 175, 55, 0.1);
            pointer-events: none;
            z-index: 9999;
            transition: all 0.3s ease;
        }
        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 15px;
            border-radius: 8px;
            z-index: 10000;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .controls button {
            background: #D4AF37;
            color: #000;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s ease;
        }
        .controls button:hover {
            background: #b5952f;
        }
        .controls button.active {
            background: #4CAF50;
        }
    </style>
</head>
<body>
    <!-- Test Panel -->
    <div class="test-panel">
        <div class="size-indicator" id="sizeIndicator">Loading...</div>
        <div>Viewport: <span id="viewportSize">-</span></div>
        <div>Device: <span id="deviceType" class="breakpoint">-</span></div>
        <div>Orientation: <span id="orientation">-</span></div>
        <div>Pixel Ratio: <span id="pixelRatio">-</span></div>
    </div>

    <!-- Device Frame -->
    <div class="device-frame" id="deviceFrame"></div>

    <!-- Controls -->
    <div class="controls">
        <button onclick="testDevice('mobile')">Mobile (375px)</button>
        <button onclick="testDevice('tablet')">Tablet (768px)</button>
        <button onclick="testDevice('laptop')">Laptop (1024px)</button>
        <button onclick="testDevice('desktop')">Desktop (1200px)</button>
        <button onclick="testDevice('custom')">Custom</button>
        <button onclick="toggleFrame()">Toggle Frame</button>
        <button onclick="runTests()">Run Tests</button>
    </div>

    <!-- Your Website Content -->
    <iframe src="index.html" style="width: 100%; height: 100vh; border: none;" id="websiteFrame"></iframe>

    <script>
        let currentTest = null;
        let frameVisible = true;

        // Update viewport information
        function updateViewportInfo() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            const ratio = window.devicePixelRatio || 1;
            
            document.getElementById('viewportSize').textContent = `${width}x${height}`;
            document.getElementById('pixelRatio').textContent = ratio.toFixed(2);
            document.getElementById('orientation').textContent = width > height ? 'Landscape' : 'Portrait';
            
            // Determine device type
            let deviceType = '';
            if (width <= 375) deviceType = 'Extra Small Mobile';
            else if (width <= 480) deviceType = 'Small Mobile';
            else if (width <= 600) deviceType = 'Medium Mobile';
            else if (width <= 768) deviceType = 'Large Mobile/Tablet';
            else if (width <= 860) deviceType = 'Tablet/Small Laptop';
            else if (width <= 1024) deviceType = 'Laptop';
            else if (width <= 1200) deviceType = 'Large Laptop';
            else deviceType = 'Desktop/Ultra Wide';
            
            document.getElementById('deviceType').textContent = deviceType;
            document.getElementById('sizeIndicator').textContent = deviceType;
        }

        // Test specific device sizes
        function testDevice(type) {
            const sizes = {
                'mobile': { width: 375, height: 667 },
                'tablet': { width: 768, height: 1024 },
                'laptop': { width: 1024, height: 768 },
                'desktop': { width: 1200, height: 800 },
                'custom': { width: prompt('Enter width:', 800), height: prompt('Enter height:', 600) }
            };

            const size = sizes[type];
            if (size && size.width && size.height) {
                const frame = document.getElementById('deviceFrame');
                frame.style.width = size.width + 'px';
                frame.style.height = size.height + 'px';
                
                // Update active button
                document.querySelectorAll('.controls button').forEach(btn => btn.classList.remove('active'));
                event.target.classList.add('active');
                
                currentTest = type;
                console.log(`Testing ${type} size: ${size.width}x${size.height}`);
            }
        }

        // Toggle device frame
        function toggleFrame() {
            const frame = document.getElementById('deviceFrame');
            frameVisible = !frameVisible;
            frame.style.display = frameVisible ? 'block' : 'none';
        }

        // Run comprehensive tests
        function runTests() {
            console.log('🧪 Running Responsiveness Tests...');
            
            const tests = [
                { name: 'Mobile (375px)', width: 375, height: 667 },
                { name: 'Small Mobile (480px)', width: 480, height: 800 },
                { name: 'Tablet (768px)', width: 768, height: 1024 },
                { name: 'Laptop (1024px)', width: 1024, height: 768 },
                { name: 'Desktop (1200px)', width: 1200, height: 800 },
                { name: 'Ultra Wide (1400px)', width: 1400, height: 900 }
            ];

            let currentTestIndex = 0;
            
            function runNextTest() {
                if (currentTestIndex < tests.length) {
                    const test = tests[currentTestIndex];
                    console.log(`📱 Testing: ${test.name}`);
                    
                    const frame = document.getElementById('deviceFrame');
                    frame.style.width = test.width + 'px';
                    frame.style.height = test.height + 'px';
                    
                    updateViewportInfo();
                    
                    currentTestIndex++;
                    setTimeout(runNextTest, 2000); // Wait 2 seconds between tests
                } else {
                    console.log('✅ All tests completed!');
                }
            }
            
            runNextTest();
        }

        // Check for responsive design issues
        function checkResponsivenessIssues() {
            const issues = [];
            const width = window.innerWidth;
            
            // Check for horizontal scroll
            if (document.body.scrollWidth > document.body.clientWidth) {
                issues.push('Horizontal scroll detected');
            }
            
            // Check text readability
            if (width <= 480) {
                const headings = document.querySelectorAll('h1, h2, h3');
                headings.forEach(h => {
                    const fontSize = window.getComputedStyle(h).fontSize;
                    if (parseFloat(fontSize) < 16) {
                        issues.push(`Text too small: ${h.tagName} - ${fontSize}`);
                    }
                });
            }
            
            // Check touch targets
            if (width <= 768) {
                const buttons = document.querySelectorAll('button, .btn');
                buttons.forEach(btn => {
                    const rect = btn.getBoundingClientRect();
                    if (rect.width < 44 || rect.height < 44) {
                        issues.push(`Touch target too small: ${rect.width}x${rect.height}px`);
                    }
                });
            }
            
            if (issues.length > 0) {
                console.warn('⚠️ Responsiveness Issues Found:', issues);
            } else {
                console.log('✅ No responsiveness issues detected');
            }
            
            return issues;
        }

        // Initialize
        window.addEventListener('resize', () => {
            updateViewportInfo();
            checkResponsivenessIssues();
        });

        window.addEventListener('load', () => {
            updateViewportInfo();
            checkResponsivenessIssues();
            console.log('🚀 Responsiveness Test Tool Ready!');
            console.log('💡 Use the buttons below to test different device sizes');
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case '1': testDevice('mobile'); break;
                case '2': testDevice('tablet'); break;
                case '3': testDevice('laptop'); break;
                case '4': testDevice('desktop'); break;
                case 't': toggleFrame(); break;
                case 'r': runTests(); break;
            }
        });
    </script>
</body>
</html>
